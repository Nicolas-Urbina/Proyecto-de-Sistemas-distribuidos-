modulo-a:
    build: ./Modulo_A
    container_name: modulo-a
    ports:
      - "8080:8080"  # Solo este módulo expone puerto a tu máquina[cite: 1, 2]
    environment:
      - PORT=8080
      - MODULO_B_URL=http://modulo-b:5000/transacciones
      - MODULO_C_URL=http://modulo-c:6000/auditoria
    depends_on:
      - modulo-b
      - modulo-c
    networks:
      - isolated-network